<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>RIFIM OS — Portal</title>
<style>
html,body{margin:0;min-height:100%;background:#050914;color:#fff;font-family:'Segoe UI',system-ui,sans-serif}
#boot{min-height:100dvh;display:grid;place-items:center;font-size:13px;color:rgba(255,255,255,.7)}
</style>
</head>
<body>
<div id="boot">Memuat RIFIM OS…</div>
<script>
(async function(){
  const response=await fetch('/modules/portal/portal-core.html',{cache:'no-store'});
  if(!response.ok) throw new Error('Portal core HTTP '+response.status);
  let html=await response.text();
  const css=`<style id="portal-login-bottom-center-v3">
  :root{--login-vvh:100dvh;--login-bottom:clamp(24px,3.6vh,46px)}
  #auth-gate{min-height:var(--login-vvh)!important;height:var(--login-vvh)!important;align-items:flex-end!important;justify-content:center!important;padding:18px 18px calc(var(--login-bottom) + env(safe-area-inset-bottom))!important;overflow-y:auto!important;scrollbar-gutter:stable both-edges}
  .auth-card{width:min(390px,calc(100vw - 36px))!important;margin:auto auto 0!important;animation:loginFloat 7s ease-in-out infinite!important}
  .logo-stage{height:78px!important;margin:0 auto 8px!important}
  .auth-logo{width:min(172px,62%)!important}
  .logo-glow{width:130px!important;height:130px!important}
  .login-stack{gap:9px!important}
  .auth-card input,.btn-login{height:47px!important;border-radius:14px!important}
  .auth-footer{margin-top:7px!important;font-size:9px!important;line-height:1.35!important}
  .login-glow{bottom:calc(var(--login-bottom) + 18px)!important;height:min(285px,42vh)!important}
  @media(min-width:768px) and (min-height:720px){
    #auth-gate{padding-top:18px!important}
    .auth-card{width:min(390px,calc(100vw - 48px))!important}
  }
  @media(max-width:767px){
    :root{--login-bottom:clamp(14px,2.5vh,24px)}
    #auth-gate{padding-left:12px!important;padding-right:12px!important}
    .auth-card{width:min(100%,390px)!important}
    .logo-stage{height:70px!important;margin-bottom:6px!important}
    .auth-logo{width:min(160px,58%)!important}
    .auth-card input,.btn-login{height:46px!important}
  }
  body.keyboard-open #auth-gate{align-items:flex-start!important;padding-top:max(12px,env(safe-area-inset-top))!important;padding-bottom:max(12px,env(safe-area-inset-bottom))!important}
  body.keyboard-open .auth-card{margin:auto auto 0!important;animation:none!important}
  body.keyboard-open .logo-stage{height:52px!important;margin-bottom:4px!important}
  body.keyboard-open .auth-logo{width:min(132px,52%)!important}
  body.keyboard-open .logo-glow{width:96px!important;height:96px!important}
  body.keyboard-open .auth-footer{display:none!important}
  body.keyboard-open .auth-card input,body.keyboard-open .btn-login{height:44px!important}
  @media(max-height:560px){
    .auth-card{animation:none!important}
    .logo-stage{height:48px!important;margin-bottom:4px!important}
    .auth-logo{width:min(128px,50%)!important}
    .auth-footer{display:none!important}
  }
  </style>`;
  const keyboardScript='<script id="portal-visual-viewport-v3">(function(){var root=document.documentElement,base=window.innerHeight;function sync(){var vv=window.visualViewport;var h=vv?vv.height:window.innerHeight;root.style.setProperty("--login-vvh",Math.max(320,Math.round(h))+"px");document.body.classList.toggle("keyboard-open",!!vv&&(base-vv.height)>140)}if(window.visualViewport){window.visualViewport.addEventListener("resize",sync);window.visualViewport.addEventListener("scroll",sync)}window.addEventListener("resize",function(){if(!document.activeElement||!/INPUT|TEXTAREA/.test(document.activeElement.tagName))base=window.innerHeight;sync()});document.addEventListener("focusin",function(e){if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)){setTimeout(function(){sync();e.target.scrollIntoView({block:"center",behavior:"smooth"})},120)}});document.addEventListener("focusout",function(){setTimeout(function(){base=window.innerHeight;document.body.classList.remove("keyboard-open");sync()},180)});sync()})();<'+'/script>';
  html=html.replace('</head>',css+'</head>').replace('</body>',keyboardScript+'</body>');
  document.open();document.write(html);document.close();
})().catch(function(err){document.getElementById('boot').textContent='Gagal memuat Portal: '+err.message;console.error(err)});
</script>
</body>
</html>
