name: Deploy to Google Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'automation/apps-script/**'
      - '.github/workflows/deploy-gas.yml'

jobs:
  deploy-gas:
    name: clasp push + production redeploy
    runs-on: ubuntu-latest
    env:
      GAS_DEPLOYMENT_ID: AKfycbzzK75gxawaylaUZpoC1zp_hq5ktznlN7scIl24HkdEgR2l3cVmpUSLck0potcMZZtw

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp credentials
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Stamp deployMeta.js with commit SHA + timestamp
        # 2026-09-01: finance_ping healthcheck reads DEPLOY_META constants to
        # tell CI which version is actually running. Stamp them here, before
        # clasp push, so the pushed source carries the real values instead of
        # the local-dev placeholder. Never edit deployMeta.js by hand -- this
        # step overwrites it on every push.
        run: |
          cd automation/apps-script
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > deployMeta.js <<EOF
          /**
           * DEPLOY META -- auto-overwritten by deploy-gas.yml. See the
           * committed copy for full docs.
           */
          var DEPLOY_META = {
            version: '${GITHUB_SHA}',
            deployed_at: '${NOW}',
          };
          EOF

      - name: Push source to Apps Script
        run: |
          cd automation/apps-script
          clasp push --force

      - name: Redeploy existing production Web App
        # 2026-09-01 root-cause fix: the previous command was
        #   `clasp update-deployment <ID> --description "..."`
        # which -- despite the workflow reporting success on every run --
        # only updates the deployment's DESCRIPTION metadata; it does NOT
        # create a new script version, and it does NOT swap the deployment
        # to the freshly-pushed source. The live Web App stayed on whatever
        # version was originally deployed via the GAS Editor, and every
        # `automation/apps-script/**` change since then landed in source
        # but never in production. That is why Finance's POST endpoints
        # returned the "Maaf, saat ini tidak dapat membuka file" HTML page
        # (surfaced upstream as "GAS balas HTML") even though the CI
        # workflow was green -- the doPost handler in the deployed bundle
        # was old enough to be broken.
        #
        # `clasp deploy --deploymentId <ID> --description "..."` creates a
        # new script version from HEAD and updates the named deployment to
        # point at it, preserving the deployment ID (and therefore the
        # public Web App URL). This is the actually-redeploying command.
        run: |
          cd automation/apps-script
          clasp deploy --deploymentId "$GAS_DEPLOYMENT_ID" --description "GitHub main ${GITHUB_SHA}"
