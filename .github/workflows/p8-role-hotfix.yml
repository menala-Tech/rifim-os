name: P8 role smoke hotfix

on:
  push:
    branches:
      - fix/p8-role-smoke-closure-20260810
    paths:
      - .github/workflows/p8-role-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p8-role-smoke-closure-20260810
      - name: Apply P8 role contract hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # 1) CRM backend: read endpoints must remain readable for Management,
          # while every mutation continues through CRM_WRITE_ROLES.
          p = Path('automation/apps-script/crmApi.js')
          s = p.read_text(encoding='utf-8')
          read_functions = [
              '_crmRaosUsersList_',
              '_crmRaosCredentialsList_',
              '_crmContactsList_',
              '_hrisPayrollBonusList_',
              '_hrisAttendanceRaosList_',
              '_hrisAttendanceSummaryMonth_',
              '_hrisGapokProporsionalList_',
          ]
          for fn in read_functions:
              pat = rf'(function\s+{re.escape(fn)}\s*\(params\)\s*\{{\s*)_crmRequireAdmin_\(params\);'
              s, _ = re.subn(pat, r'\1_crmRequireRead_(params);', s, count=1)
          write(p, s)

          # 2) CRM frontend: privileged API is POST+token only; Management is read-only.
          p = Path('modules/crm/index.html')
          s = p.read_text(encoding='utf-8')
          auth_block = r'''let _crmRole = '';
let _crmCanWrite = false;
let _crmRoleObserver = null;

function checkAuth() {
  let sess = null;
  try { sess = JSON.parse(localStorage.getItem('rifim_auth') || 'null'); } catch(e) {}
  if (!sess || !sess.email || !sess.access_token) {
    localStorage.removeItem('rifim_auth');
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    return null;
  }
  if (sess.ts && Date.now() - sess.ts > 12 * 3600 * 1000) {
    localStorage.removeItem('rifim_auth');
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    return null;
  }
  const role = String(sess.role || '').toLowerCase();
  if (!['admin','management','direksi','direktur'].includes(role)) {
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    return null;
  }
  _crmRole = role;
  _crmCanWrite = ['admin','direksi','direktur'].includes(role);
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('hdr-name').textContent = sess.name || sess.email;
  document.getElementById('hdr-role').textContent = role.toUpperCase() + (_crmCanWrite ? '' : ' · READ ONLY');
  return sess;
}

function _crmApplyReadonlyControls() {
  if (_crmCanWrite) return;
  [
    '#cc-save','#sc-save','#wl-new-email','#wl-add-btn',
    '#ru-modal-save','#ru-modal-reset-pin','#ru-modal-update-ssot-pin','#ru-modal-reset-portal-pin',
    '#ct-add-btn','#ct-modal-save',
    'button[data-edit]','button[data-remove]','button[data-edit-user]',
    'button[data-edit-ct]','button[data-del-ct]'
  ].forEach(sel => document.querySelectorAll(sel).forEach(el => { el.style.display = 'none'; el.disabled = true; }));
  document.querySelectorAll('input[data-section="company"],input[data-section="system"]').forEach(el => {
    el.readOnly = true;
    el.style.cursor = 'default';
  });
}

function applyCrmRoleUi() {
  _crmApplyReadonlyControls();
  if (_crmCanWrite || _crmRoleObserver) return;
  const app = document.getElementById('app');
  if (!app) return;
  _crmRoleObserver = new MutationObserver(_crmApplyReadonlyControls);
  _crmRoleObserver.observe(app, { childList: true, subtree: true });
}
'''
          pat = r'function checkAuth\(\) \{.*?\n\}\n\n(?=// ═+\n// RENDER CONFIG TABLES)'
          s, n = re.subn(pat, auth_block + '\n', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('CRM checkAuth block not found')

          gas_block = r'''let _crmSessionClient = null;
async function _crmGetAccessToken() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('rifim_auth') || '{}'); } catch (_) { return ''; }
  if (window.supabase && saved.refresh_token) {
    try {
      if (!_crmSessionClient) {
        _crmSessionClient = window.supabase.createClient(
          'https://vlievtojpmrbsmzlqswl.supabase.co',
          'sb_publishable_8KpL6zmpt_O_x21v4Jn3Tw_J_I3y-r1',
          { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } },
        );
      }
      let session = (await _crmSessionClient.auth.getSession()).data.session;
      const expiring = !session || !session.expires_at || session.expires_at * 1000 < Date.now() + 60000;
      if (expiring) session = (await _crmSessionClient.auth.refreshSession({ refresh_token: saved.refresh_token })).data.session;
      if (session?.access_token) {
        saved.access_token = session.access_token;
        saved.refresh_token = session.refresh_token || saved.refresh_token;
        saved.expires_at = session.expires_at || saved.expires_at;
        localStorage.setItem('rifim_auth', JSON.stringify(saved));
        return session.access_token;
      }
    } catch (_) {}
  }
  return saved.access_token || '';
}

async function _gasCall(action, extra) {
  const token = await _crmGetAccessToken();
  if (!token) throw new Error('Session token tidak ada. Login ulang melalui Portal.');
  const body = Object.assign({ action, access_token: token }, extra || {});
  if (window.RifimAPI) return RifimAPI.post(body);
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
  });
  return res.json();
}

'''
          pat = r'async function _gasCall\(action, extra\) \{.*?\n\}\n\n(?=async function loadWhitelist)'
          s, n = re.subn(pat, gas_block, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('CRM _gasCall block not found')

          old_boot = "if (checkAuth()) {\n  renderCompanyConfig();\n  renderSystemConfig();\n}"
          new_boot = "const _crmBootSession = checkAuth();\nif (_crmBootSession) {\n  renderCompanyConfig();\n  renderSystemConfig();\n  applyCrmRoleUi();\n}"
          if old_boot not in s:
              raise SystemExit('CRM boot block not found')
          s = s.replace(old_boot, new_boot, 1)
          write(p, s)

          # 3) Finance: all CRM calls use POST+token. Management is monitor/read-only.
          p = Path('modules/finance/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('// Finance = admin/management/direksi only', '// Finance: Management read-only; Admin/Direksi write')
          s = s.replace("if (!['admin','management','direksi'].includes(role)) {", "if (!['admin','management','direksi','direktur'].includes(role)) {", 1)
          s = s.replace('Modul Finance hanya untuk role Admin, Management, atau Direksi.', 'Modul Finance hanya untuk role Admin, Management, atau Direksi/Direktur.', 1)
          anchor = "function checkAuth() {"
          if 'let FIN_CAN_WRITE = false;' not in s:
              s = s.replace(anchor, "let FIN_CAN_WRITE = false;\n\n" + anchor, 1)
          needle = "  document.getElementById('hdr-role').textContent = role.toUpperCase();\n  return sess;"
          repl = "  FIN_CAN_WRITE = ['admin','direksi','direktur'].includes(role);\n  document.getElementById('hdr-role').textContent = role.toUpperCase() + (FIN_CAN_WRITE ? '' : ' · READ ONLY');\n  if (!FIN_CAN_WRITE) setTimeout(_finApplyReadonlyUi, 0);\n  return sess;"
          if needle not in s:
              raise SystemExit('Finance role anchor not found')
          s = s.replace(needle, repl, 1)

          show_gate_pat = r"function showGate\(\) \{\n  document\.getElementById\('gate'\)\.style\.display = 'flex';\n  document\.getElementById\('app'\)\.style\.display = 'none';\n\}"
          show_gate_repl = r'''function showGate() {
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

let _finRoleObserver = null;
function _finApplyReadonlyUi() {
  if (FIN_CAN_WRITE) return;
  document.querySelectorAll('.panel[data-panel="input"],.tab[data-tab="input"]').forEach(el => el.style.display = 'none');
  document.querySelectorAll('#tc-recompute,#dd-assign,#dd-rebalance,button[data-mark-saldo]').forEach(el => { el.style.display = 'none'; el.disabled = true; });
  document.querySelectorAll('.panel[data-panel="target-cabang"] input[type="number"],.panel[data-panel="target-staff"] input[type="number"]').forEach(el => el.readOnly = true);
  document.querySelectorAll('button').forEach(btn => {
    if (/lunas|simpan|recompute|assign|rebalance|tagihan baru|tambah tagihan/i.test(btn.textContent || '')) {
      btn.style.display = 'none'; btn.disabled = true;
    }
  });
  if (!_finRoleObserver) {
    const app = document.getElementById('app');
    if (app) {
      _finRoleObserver = new MutationObserver(_finApplyReadonlyUi);
      _finRoleObserver.observe(app, { childList: true, subtree: true });
    }
  }
}'''
          s, n = re.subn(show_gate_pat, show_gate_repl, s, count=1)
          if n != 1:
              raise SystemExit('Finance showGate block not found')

          fin_gas = r'''const FIN_WRITE_ACTIONS = new Set([
  'finance_tagihan_add','finance_tagihan_mark_paid','finance_saldo_raos_mark_paid',
  'finance_kpi_target_branch_upsert','finance_kpi_target_staff_upsert',
  'finance_payroll_compute','finance_driver_assign_random'
]);

async function _gasCall(action, extra) {
  if (FIN_WRITE_ACTIONS.has(action) && !FIN_CAN_WRITE) {
    throw new Error('Role Management bersifat read-only untuk Finance.');
  }
  const token = await _finGetAccessToken();
  if (!token) throw new Error('Session token tidak ada. Login ulang melalui Portal.');
  const body = Object.assign({ action, access_token: token }, extra || {});
  if (window.RifimAPI) return RifimAPI.post(body);
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
  });
  return res.json();
}

'''
          pat = r'async function _gasCall\(action, extra\) \{.*?\n\}\n\n(?=const fmtRp)'
          s, n = re.subn(pat, fin_gas, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Finance _gasCall block not found')
          s = s.replace('assignment random ke staff (management-only edit).', 'assignment random ke staff (Admin/Direksi edit; Management read-only).')
          s = s.replace('Assignment driver → staff dilakukan random oleh management/direksi.\n        Admin &amp; koordinator hanya bisa lihat (read-only).', 'Assignment driver → staff dilakukan random oleh Admin/Direksi.\n        Management &amp; koordinator hanya bisa lihat (read-only).')
          s = s.replace('🎲 Random Assign (admin/mgmt/direksi)', '🎲 Random Assign (admin/direksi)')
          write(p, s)

          # 4) Sistem console: Management can monitor logs but cannot run maintenance.
          p = Path('modules/sistem/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const ALLOWED_ROLES = ['admin', 'direksi', 'management'];", "const ALLOWED_ROLES = ['admin', 'direksi', 'direktur', 'management'];", 1)
          if 'let _systemCanWrite = false;' not in s:
              s = s.replace('let _autorefTimer = null;', 'let _autorefTimer = null;\nlet _systemCanWrite = false;', 1)
          needle = "  document.getElementById('user-info').textContent = `${profile.full_name} · ${profile.role}`;\n  document.getElementById('app').style.display = 'block';\n  // Load log initial"
          repl = "  _systemCanWrite = ['admin','direksi','direktur'].includes(profile.role);\n  document.getElementById('user-info').textContent = `${profile.full_name} · ${profile.role}` + (_systemCanWrite ? '' : ' · READ ONLY');\n  document.getElementById('app').style.display = 'block';\n  if (!_systemCanWrite) document.querySelectorAll('.card button').forEach(btn => { btn.style.display = 'none'; btn.disabled = true; });\n  // Load log initial"
          if needle not in s:
              raise SystemExit('Sistem bootstrap anchor not found')
          s = s.replace(needle, repl, 1)
          needle = "async function runAction(action, btn) {\n  const card = btn.closest('.card');"
          repl = "async function runAction(action, btn) {\n  if (!_systemCanWrite) { toast('Role Management bersifat read-only.', 'err'); return; }\n  const card = btn.closest('.card');"
          if needle not in s:
              raise SystemExit('Sistem runAction anchor not found')
          s = s.replace(needle, repl, 1)
          write(p, s)

          print('P8 role smoke hotfix applied')
          PY
      - name: Validate static scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in ['modules/crm/index.html','modules/finance/index.html','modules/sistem/index.html','automation/apps-script/crmApi.js']:
              text = Path(path).read_text(encoding='utf-8')
              assert '<<<<<<<' not in text and '>>>>>>>' not in text
              print(path, len(text))
          PY
      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "p8-role-hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add automation/apps-script/crmApi.js modules/crm/index.html modules/finance/index.html modules/sistem/index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(p8): enforce read-only management across center modules"
          git push origin HEAD:fix/p8-role-smoke-closure-20260810
