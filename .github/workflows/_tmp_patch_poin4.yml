name: Temporary patch Poin 4

on:
  push:
    branches:
      - feat/finance-open-aist-button

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/finance-open-aist-button
          fetch-depth: 0
      - name: Apply exact Finance patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('modules/finance/index.html')
          s = p.read_text(encoding='utf-8')
          old = '''        <input class="grow" placeholder="Cari driver / staff / no request…" id="sr-search">\n        <button class="btn ghost small">🔄 Refresh</button>\n      </div>'''
          new = '''        <input class="grow" placeholder="Cari driver / staff / no request…" id="sr-search">\n        <button class="btn ghost small">🔄 Refresh</button>\n        <button class="btn ghost small" onclick="window.open('https://aist-id.taxsee.com/', '_blank', 'noopener,noreferrer')" title="Buka AIST Maxim di tab baru">🌐 Buka AIST</button>\n      </div>'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exact context once, found {count}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit actual change and remove temp workflow
        run: |
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          rm .github/workflows/_tmp_patch_poin4.yml
          git add modules/finance/index.html .github/workflows/_tmp_patch_poin4.yml
          git commit -m "feat(finance): tombol Buka AIST di tab saldo-raos (poin 4)" -m "Co-Authored-By: ChatGPT <noreply@openai.com>"
          git push origin HEAD:feat/finance-open-aist-button
