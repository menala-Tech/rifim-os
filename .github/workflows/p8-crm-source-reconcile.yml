name: P8 CRM source reconcile

on:
  push:
    branches:
      - chore/p8-repository-closure-20260810
    paths:
      - scripts/.p8_crm_source.part01.b64
      - scripts/.p8_crm_source.part02.b64
      - scripts/.p8_crm_source.part03.b64
      - .github/workflows/p8-crm-source-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/p8-repository-closure-20260810

      - name: Restore canonical P8 CRM source
        shell: python
        run: |
          import base64
          import gzip
          import hashlib
          import pathlib

          root = pathlib.Path('.')
          encoded = ''.join(
              ''.join((root / f'scripts/.p8_crm_source.part{i:02d}.b64').read_text().split())
              for i in range(1, 4)
          )
          data = gzip.decompress(base64.b64decode(encoded))
          expected = 'a54e13c48fb3a1b910b1f3e17ceffde7ee65f5201305b1dcae781688d88a6c64'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'checksum mismatch: {actual}')
          (root / 'automation/apps-script/crmApi.js').write_bytes(data)

      - name: Validate JavaScript syntax
        run: node --check automation/apps-script/crmApi.js

      - name: Commit canonical source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/apps-script/crmApi.js
          if git diff --cached --quiet; then
            echo "crmApi.js already canonical"
            exit 0
          fi
          git commit -m "chore(p8): sync canonical CRM production source"
          git push origin HEAD:chore/p8-repository-closure-20260810
