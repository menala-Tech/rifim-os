name: Temporary patch Poin 5

on:
  push:
    branches:
      - feat/finance-desktop-notif-repeating

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/finance-desktop-notif-repeating
          fetch-depth: 0
      - name: Apply exact Finance notifier patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          p = Path('modules/finance/index.html')
          s = p.read_text(encoding='utf-8')

          def dec(value):
              return base64.b64decode(value).decode('utf-8')

          def replace_once(old_b64, new_b64, label):
              global s
              old = dec(old_b64)
              new = dec(new_b64)
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected once, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              'bGV0IF9zckZhbGxiYWNrVGltZXIgPSBudWxsOwpsZXQgX3NyRmFsbGJhY2tGaXJzdFJ1biA9IHRydWU7',
              '',
              'state'
          )
          replace_once(
              '',
              '',
              'notify'
          )
          replace_once(
              '',
              '',
              'paid'
          )
          replace_once(
              'ICAgIGlmICghZGF0YS5zdWNjZXNzIHx8ICFBcnJheS5pc0FycmF5KGRhdGEucm93cykpIHJldHVybjsKICAgIGlmIChfc3JGYWxsYmFja0ZpcnN0UnVuKSB7',
              '',
              'poll'
          )
          replace_once(
              'ICBjb25zdCB1bmxvY2sgPSAoKSA9PiB7CiAgICBpZiAoX3NyQXVkaW9DdHggJiYgX3NyQXVkaW9DdHguc3RhdGUgPT09ICdzdXNwZW5kZWQnKSBfc3JBdWRpb0N0eC5yZXN1bWUoKTsKICAgIGRvY3VtZW50LnJlbW92ZUV2ZW50TGlzdGVuZXIoJ2NsaWNrJywgdW5sb2NrKTsKICAgIGRvY3VtZW50LnJlbW92ZUV2ZW50TGlzdGVuZXIoJ2tleWRvd24nLCB1bmxvY2spOwogIH07',
              '',
              'unlock'
          )

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit actual change and remove temp workflow
        run: |
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          rm .github/workflows/_tmp_patch_poin5.yml
          git add modules/finance/index.html .github/workflows/_tmp_patch_poin5.yml
          git commit -m "feat(finance): desktop notif + repeating audio loop saldo (poin 5)" -m "Co-Authored-By: ChatGPT <noreply@openai.com>"
          git push origin HEAD:feat/finance-desktop-notif-repeating
