name: hris-fast-read-temp
on:
  push:
    branches:
      - perf/hris-fast-read-20260817
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/hris-fast-read-20260817
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch_hris_fast_read.py
      - name: Validate
        run: |
          node --check api/internal/hris-v2.js
          grep -q "mode==='employees'" api/internal/hris-v2.js
          grep -q "async function _fetchEmployeesFast" modules/hris/index.html
          grep -q "Stale-while-revalidate" modules/hris/index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/internal/hris-v2.js modules/hris/index.html
          git commit -m "perf(hris): use direct Supabase read with stale cache"
          git push origin HEAD:perf/hris-fast-read-20260817
