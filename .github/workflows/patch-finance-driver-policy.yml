name: One-shot Finance Driver Policy Patch

on:
  push:
    branches:
      - codex/integration-p0-20260817
    paths:
      - .github/workflows/patch-finance-driver-policy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integration-p0-20260817
          fetch-depth: 0
      - name: Align Finance DB Driver policy UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('modules/finance/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'Daftar driver per cabang + assignment random ke staff (management-only edit).':
              'Daftar driver per cabang + assignment random ke staff. Admin dan Direksi dapat mengubah assignment; Management dan Koordinator hanya lihat.',
            '<strong>Aturan:</strong> Assignment driver → staff dilakukan random oleh management/direksi.\n        Admin &amp; koordinator hanya bisa lihat (read-only). Rebalance (p_force=true) akan reset':
              '<strong>Aturan:</strong> Assignment driver → staff dilakukan random oleh Admin/Direksi.\n        Management &amp; Koordinator hanya bisa lihat (read-only). Rebalance (p_force=true) akan reset',
            '<button class="btn small" id="dd-assign">🎲 Random Assign (admin/mgmt/direksi)</button>':
              '<button class="btn small" id="dd-assign">🎲 Random Assign (Admin/Direksi)</button>',
            "  if (!session || !checkAuth()) return;\n  populateCabang();":
              "  if (!session || !checkAuth()) return;\n  const canMutate = _finCanMutate();\n  const assignBtn = document.getElementById('dd-assign');\n  const rebalanceBtn = document.getElementById('dd-rebalance');\n  if (assignBtn) assignBtn.style.display = canMutate ? '' : 'none';\n  if (rebalanceBtn) rebalanceBtn.style.display = canMutate ? '' : 'none';\n  populateCabang();",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected snippet not found: {old[:100]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- modules/finance/index.html
      - name: Commit patch
        run: |
          git config user.name "Menala-Tech"
          git config user.email "menalagemilang@gmail.com"
          git add modules/finance/index.html
          git commit -m "fix(finance): align driver assignment role policy"
          git push origin HEAD:codex/integration-p0-20260817
