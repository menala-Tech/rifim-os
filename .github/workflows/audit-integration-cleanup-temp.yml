name: audit-integration-cleanup-temp
on:
  push:
    branches: [audit-full-sync-20260817]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-full-sync-20260817
          fetch-depth: 0
      - name: Patch CRM mirror verification, Finance stale copy, Smart Office auth residue
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # CRM: success only after canonical write + canonical readback verify + GAS mirror success.
          p = Path('modules/crm/index.html')
          s = p.read_text()
          s = s.replace('// SAVE HANDLERS (TODO: backend integration)', '// SAVE HANDLERS — canonical write + verified mirror sync')
          old = """  const results = { ok: 0, err: 0, errors: [] };
  const me = _wlCurrentUserEmail();
  for (const item of payload) {
    const { data, error } = await sb.rpc('set_system_config', {
      p_key: item.key, p_value: item.value,
    });
    if (error) { results.err++; results.errors.push(`${item.key}: ${error.message}`); }
    else { results.ok++; }
    // Fire-and-forget: sync juga ke sheet SISTEM CONFIG via GAS
    // (Supabase Row sudah tersimpan; sheet sync boleh gagal tanpa blok user)
    _gasCall('sistem_config_set', { key: item.key, value: item.value, user: me })
      .catch(err => console.warn('Sheet sync gagal utk ' + item.key, err));
  }

  if (results.err === 0) {
    showStatus(`✅ ${results.ok} config tersimpan (Supabase + sync sheet fire-and-forget)`, 'ok');
"""
          new = """  const results = { ok: 0, err: 0, errors: [] };
  const me = _wlCurrentUserEmail();
  for (const item of payload) {
    try {
      const { error } = await sb.rpc('set_system_config', {
        p_key: item.key, p_value: item.value,
      });
      if (error) throw new Error('Supabase write gagal: ' + error.message);

      // Verify canonical read-back before mirroring.
      const { data: verifyRows, error: verifyError } = await sb.rpc('list_system_config');
      if (verifyError) throw new Error('Supabase verify gagal: ' + verifyError.message);
      const verified = Array.isArray(verifyRows) && verifyRows.some(row =>
        String(row.key) === String(item.key) && String(row.value ?? '') === String(item.value ?? '')
      );
      if (!verified) throw new Error('Supabase verify mismatch setelah write');

      // Mirror is part of the transaction contract from the user's perspective:
      // do not report success unless GAS confirms the Sheet write.
      const mirror = await _gasCall('sistem_config_set', {
        key: item.key, value: item.value, user: me,
      });
      if (!mirror || mirror.success !== true) {
        throw new Error('Sheet mirror gagal: ' + ((mirror && mirror.message) || 'response tidak valid'));
      }
      results.ok++;
    } catch (err) {
      results.err++;
      results.errors.push(`${item.key}: ${err.message}`);
    }
  }

  if (results.err === 0) {
    showStatus(`✅ ${results.ok} config tersimpan dan mirror Sheet terverifikasi`, 'ok');
"""
          if old not in s:
            raise SystemExit('CRM target block not found')
          s = s.replace(old, new)
          if 'fire-and-forget' in s:
            raise SystemExit('CRM fire-and-forget residue remains')
          p.write_text(s)

          # Finance: code already calls the backend actions; remove stale TODO/"belum terhubung" copy only.
          p = Path('modules/finance/index.html')
          s = p.read_text()
          replacements = {
            '<strong>Read path (TODO):</strong> extend GAS di spreadsheet 1AgpEqhpDU4B dengan\n        <code>doGet</code> action <code>finance_list</code> return JSON. Pagination server-side\n        (979 baris → chunk 100).<br>\n        <strong>Filter yang perlu:</strong> range tanggal, kategori, jenis (in/out), cabang, sumber.':
            '<strong>Read path aktif:</strong> GAS action <code>finance_list</code> → JSON ledger, dengan filter tanggal, jenis, cabang, dan limit server-side.',
            '<strong>TODO GAS:</strong> action <code>cabang_list&amp;sheet={nama_tab}</code>.':
            '<strong>Read path aktif:</strong> GAS action <code>finance_cabang_list&amp;sheet={nama_tab}</code>.',
            '<strong>TODO GAS:</strong> <code>tagihan_list/add/mark_paid</code>. Add tagihan baru\n        write ke <code>New Tagihan</code>, lalu daily cron pindah ke <code>Tagihan</code> + sheet bulan.':
            '<strong>Backend aktif:</strong> <code>finance_tagihan_list</code>, <code>finance_tagihan_add</code>, dan <code>finance_tagihan_mark_paid</code>.',
            '<strong>TODO:</strong> parse pivot sheet (bukan raw ledger). Kalau chart perlu, pakai\n        Chart.js CDN. 2 chart: (a) stacked bar per cabang per bulan, (b) line trend harian\n        30 hari terakhir.':
            '<strong>Backend aktif:</strong> <code>finance_rekap_harian</code> + <code>finance_rekap_bulanan</code>; UI merender tabel rekap dari hasil GAS.',
            '<div class="empty"><div class="icon">📆</div>Belum di-implementasi. Bikin GAS action <code>rekap_harian</code> + <code>rekap_bulanan</code>.</div>':
            '<div class="empty"><div class="icon">📆</div>Rekap dimuat dari backend saat tab dibuka.</div>',
            '<strong>TODO:</strong> GAS action <code>log_list?limit=200</code>. Filter status\n        (SUCCESS/ERROR/WARN), filter fungsi. Auto-scroll ke terbaru.':
            '<strong>Read path aktif:</strong> GAS action <code>finance_log_list</code> dengan filter status/pencarian dan limit 200.',
            '<tr><td colspan="7"><div class="empty"><div class="icon">🔌</div>Belum terhubung. GAS endpoint <code>finance_list</code> belum dibuat.</div></td></tr>':
            '<tr><td colspan="7"><div class="empty"><div class="icon">🔌</div>Data ledger dimuat dari GAS <code>finance_list</code>.</div></td></tr>',
          }
          for a,b in replacements.items():
            if a not in s:
              print('WARN missing finance copy:', a[:80])
            s = s.replace(a,b)
          # Source must actually call every backend we now claim active.
          for action in ['finance_list','finance_cabang_list','finance_tagihan_list','finance_tagihan_add','finance_tagihan_mark_paid','finance_rekap_harian','finance_rekap_bulanan','finance_log_list']:
            if action not in s:
              raise SystemExit('Finance backend action absent: ' + action)
          p.write_text(s)

          # Smart Office: remove hard-coded email whitelist residue; Portal session is authoritative.
          p = Path('modules/smart-office/index.html')
          s = p.read_text()
          s = s.replace("  const ALLOWED_EMAILS  = [\n    'rifiminternasionalgemilang@gmail.com',\n    'rifiminternationalgemilang@gmail.com',\n  ];\n", "")
          s = s.replace('<div class="settings-card-title">🔒 Email yang Diizinkan</div>', '<div class="settings-card-title">🔒 Akses Portal</div>')
          s = s.replace("""          <div style="margin-top:12px;font-size:11px;color:#aaa;line-height:1.7">
            Tambah email: Google Sheets →<br>
            sheet <b style="color:#666">company_config</b> → key <b style="color:#666">allowed_emails</b><br>
            (pisah dengan koma)
          </div>""", """          <div style="margin-top:12px;font-size:11px;color:#aaa;line-height:1.7">
            Akses Smart Office mengikuti sesi dan role canonical dari Portal RIFIM OS.
            Tidak ada whitelist email lokal di modul ini.
          </div>""")
          old_settings = """    // Email list
    const emailListEl = document.getElementById('emailList');
    if (emailListEl) {
      emailListEl.innerHTML = ALLOWED_EMAILS.map(e =>
        `<div class="email-chip">✓ ${e}</div>`
      ).join('');
    }
"""
          new_settings = """    // Access is inherited from the validated Portal session.
    const emailListEl = document.getElementById('emailList');
    if (emailListEl) {
      const auth = getPortalAuth();
      emailListEl.innerHTML = `<div class="email-chip">✓ ${(auth.role || 'role').toUpperCase()} via Portal RIFIM OS</div>`;
    }
"""
          if old_settings not in s:
            raise SystemExit('Smart Office legacy email settings block not found')
          s = s.replace(old_settings, new_settings)
          if 'ALLOWED_EMAILS' in s:
            raise SystemExit('Smart Office hard-coded whitelist residue remains')
          if 'RifimPortalSession.require' not in s:
            raise SystemExit('Smart Office canonical portal bootstrap missing')
          p.write_text(s)
          PY
      - name: Verify invariants
        run: |
          ! grep -n "fire-and-forget" modules/crm/index.html
          ! grep -n "ALLOWED_EMAILS" modules/smart-office/index.html
          grep -n "mirror Sheet terverifikasi" modules/crm/index.html
          grep -n "finance_cabang_list\|finance_tagihan_list\|finance_rekap_harian\|finance_log_list" modules/finance/index.html
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/crm/index.html modules/finance/index.html modules/smart-office/index.html
          git commit -m "fix(integration): verify config mirrors and remove stale module residue"
          git push origin HEAD:audit-full-sync-20260817
